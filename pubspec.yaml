name: elite_one_mobile
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  provider: ^6.0.5
  dio: ^5.7.0
  dio_cookie_manager: ^3.1.0
  cookie_jar: ^4.0.8
  go_router: ^14.2.3
  google_fonts: ^6.2.1
  intl: ^0.20.2
  shared_preferences: ^2.3.3
  carousel_slider: ^5.0.0
  audioplayers: ^6.0.0
  fluttertoast: ^8.2.4
  flutter_localizations:
    sdk: flutter
  flutter_html: ^3.0.0
  image_picker: ^1.1.2
  # MyFatoorah Payment Gateway
  myfatoorah_flutter: ^3.0.3
  url_launcher: ^6.2.5
  webview_flutter: ^4.7.0
  connectivity_plus: ^6.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  mockito: ^5.4.4
  build_runner: ^2.4.7
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/icon/

# تكوين أيقونة التطبيق
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/app-icon.png"
  adaptive_icon_background: "#16A34A"
  adaptive_icon_foreground: "assets/app-icon.png"
  # لـ Android
  min_sdk_android: 21
